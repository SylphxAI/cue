name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example 0.3.4). Leave empty to use package.json. Ignored when deprecate_only is true.'
        required: false
        default: ''
      deprecate_only:
        description: 'Only deprecate io.github.SylphxAI/video-reader-mcp. Do not publish.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish MCP Registry metadata
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pinned mcp-publisher
        run: |
          set -euo pipefail
          PUBLISHER_VERSION='v1.8.1'
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              ASSET='mcp-publisher_linux_amd64.tar.gz'
              SHA256='a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
              ;;
            Linux-aarch64|Linux-arm64)
              ASSET='mcp-publisher_linux_arm64.tar.gz'
              SHA256='8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4'
              ;;
            *)
              echo "Unsupported publisher host: $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac
          ARCHIVE="$RUNNER_TEMP/$ASSET"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${ASSET}"
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" mcp-publisher

      - name: Verify source and npm versions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deprecate_only != true }}
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
            if [[ -z "$VERSION" ]]; then
              VERSION="$(jq -r .version package.json)"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          test "$(jq -r .version package.json)" = "$VERSION"
          test "$(jq -r .version server.json)" = "$VERSION"
          test "$(jq -r .name server.json)" = 'io.github.SylphxAI/cue'
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].identifier' server.json)" = '@sylphx/cue'
          test "$(npm view "@sylphx/cue@$VERSION" version)" = "$VERSION"
          echo "Publishing source-bound MCP Registry metadata for version=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate server.json
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deprecate_only != true }}
        run: ./mcp-publisher validate

      - name: Check canonical registry state
        id: canonical-state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deprecate_only != true }}
        run: |
          set -euo pipefail
          URL='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SylphxAI%2Fcue/versions/latest'
          WEBSITE="$(jq -r '.websiteUrl' server.json)"
          REPO="$(jq -r '.repository.url' server.json)"
          DESC="$(jq -r '.description' server.json)"
          if curl -fsS "$URL" > "$RUNNER_TEMP/cue-before.json" && \
            jq -e --arg version "$VERSION" \
              '.server.name == "io.github.SylphxAI/cue" and .server.version == $version and .server.packages[0].identifier == "@sylphx/cue" and .server.packages[0].version == $version' \
              "$RUNNER_TEMP/cue-before.json" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "status=$(jq -r '._meta["io.modelcontextprotocol.registry/official"].status' "$RUNNER_TEMP/cue-before.json")" >> "$GITHUB_OUTPUT"
            if jq -e --arg website "$WEBSITE" --arg repo "$REPO" --arg desc "$DESC" \
              '.server.websiteUrl == $website and .server.repository.url == $repo and .server.description == $desc' \
              "$RUNNER_TEMP/cue-before.json" >/dev/null; then
              echo 'matches=true' >> "$GITHUB_OUTPUT"
            else
              echo 'matches=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'status=missing' >> "$GITHUB_OUTPUT"
            echo 'matches=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish or edit the MCP Registry record
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deprecate_only != true }}
        run: |
          set -euo pipefail
          TOKEN_FILE="$HOME/.config/mcp-publisher/token.json"
          test -f "$TOKEN_FILE" || { echo "missing $TOKEN_FILE; did the login step run?" >&2; exit 1; }
          TOKEN="$(jq -r '.token' "$TOKEN_FILE")"
          REGISTRY="$(jq -r '.registry' "$TOKEN_FILE")"
          case "$REGISTRY" in */) ;; *) REGISTRY="$REGISTRY/" ;; esac
          NAME='io.github.SylphxAI/cue'
          ESCAPED_NAME="$(node -p "encodeURIComponent(process.argv[1])" "$NAME")"

          if [ "${{ steps.canonical-state.outputs.exists }}" != 'true' ]; then
            ./mcp-publisher publish
            exit 0
          fi
          if [ "${{ steps.canonical-state.outputs.matches }}" = 'true' ]; then
            echo "Registry record already matches server.json; nothing to publish"
            exit 0
          fi

          echo "Registry record drifted; editing $NAME@$VERSION in place"
          if ! out=$(curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @server.json \
            "${REGISTRY}v0/servers/${ESCAPED_NAME}/versions/${VERSION}" 2>&1); then
            echo "$out" >&2
            echo "Cannot edit $NAME@$VERSION in place. github-oidc can publish a new version; it cannot edit a frozen one." >&2
            exit 1
          fi
          echo "$out"

      - name: Read back canonical Cue identity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deprecate_only != true }}
        run: |
          set -euo pipefail
          URL='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SylphxAI%2Fcue/versions/latest'
          for attempt in $(seq 1 36); do
            if curl -fsS "$URL" > "$RUNNER_TEMP/cue-registry.json" && \
              jq -e --arg version "$VERSION" \
                --arg website "$(jq -r '.websiteUrl' server.json)" \
                --arg repo "$(jq -r '.repository.url' server.json)" \
                '.server.name == "io.github.SylphxAI/cue" and .server.version == $version and .server.packages[0].identifier == "@sylphx/cue" and .server.packages[0].version == $version and .server.websiteUrl == $website and .server.repository.url == $repo and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
                "$RUNNER_TEMP/cue-registry.json" >/dev/null; then
              cat "$RUNNER_TEMP/cue-registry.json"
              exit 0
            fi
            echo "MCP Registry readback wait $attempt for Cue $VERSION"
            sleep 5
          done
          echo "Canonical Cue registry readback failed" >&2
          exit 1

      - name: Deprecate retired MCP Registry identity
        run: |
          set -euo pipefail
          if ! out=$(./mcp-publisher status \
              --status deprecated \
              --all-versions \
              --yes \
              --message 'Retired identity. Use io.github.SylphxAI/cue.' \
              io.github.SylphxAI/video-reader-mcp 2>&1); then
            if grep -qE 'already set to the provided values|No changes to apply' <<<"$out"; then
              echo "Retired identity already deprecated; nothing to do"
            else
              echo "$out" >&2
              exit 1
            fi
          fi
          URL='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SylphxAI%2Fvideo-reader-mcp/versions/latest'
          for attempt in $(seq 1 24); do
            if curl -fsS "$URL" > "$RUNNER_TEMP/retired-registry.json" && \
              jq -e '._meta["io.modelcontextprotocol.registry/official"].status == "deprecated"' \
                "$RUNNER_TEMP/retired-registry.json" >/dev/null; then
              cat "$RUNNER_TEMP/retired-registry.json"
              exit 0
            fi
            echo "MCP Registry deprecation readback wait $attempt"
            sleep 5
          done
          echo "Retired registry identity deprecation readback failed" >&2
          exit 1
