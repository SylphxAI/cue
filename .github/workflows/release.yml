name: Release

on:
  push:
    branches:
      - main
    # A version bump touches package.json, so it still releases. Docs, the
    # README, and a lockfile refresh after natives exist do not.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'bun.lock'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node (changesets publish requires npm on PATH)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check code quality
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build Rust CLI / MCP server (required before tests)
        run: bun run build:rust

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Configure npm auth for changesets publish
        run: |
          set -euo pipefail
          test -n "${{ secrets.NPM_TOKEN }}"
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
